name: guardify
description: A Dart code generation package for Role-Based UI Access Control in Flutter widgets.
version: 1.1.1
repository: https://github.com/chamod-rashmith/guardify

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  analyzer: '>=12.0.0 <15.0.0'
  build: '>=2.4.0 <5.0.0'
  code_builder: '>=4.5.0 <5.0.0'
  dart_style: '>=3.0.0 <4.0.0'
  flutter:
    sdk: flutter
  meta: ^1.9.0
  source_gen: '>=1.4.0 <5.0.0'

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  lints: '>=3.0.0 <7.0.0'
  test: ^1.24.0
